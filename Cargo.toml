[workspace]
# Default package for `cargo build`/`cargo test` at workspace root.
# Use `cargo build --workspace` or `cargo test --workspace` for all packages.
default-members = ["crates/sruja-cli"]
members = [
    # Core
    "crates/sruja-diagnostics",
    "crates/sruja-language",
    "crates/sruja-engine",
    "crates/sruja-export",
    "crates/sruja-cli",
    "crates/sruja-scan",
    "crates/sruja-diff",
    # Product
    "crates/sruja-graph-core",
    "crates/sruja-graph",
    "crates/sruja-intent",
    "crates/sruja-wasm",
    "crates/sruja-extract",
    "crates/sruja-agent",
]
resolver = "2"

[workspace.package]
version = "0.47.0"
edition = "2021"
authors = ["Sruja Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sruja-ai/sruja"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
nom = { version = "8", features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "full"] }
clap = { version = "4.6", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
proptest = "1.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde", "js"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
scip = "0.7.0"
protobuf = "3"
prost = "0.13"
prost-types = "0.13"
fastembed = "5.0"
hnsw_rs = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
