[workspace]
# Default package for `cargo build`/`cargo test` at workspace root.
# Use `cargo build --workspace` or `cargo test --workspace` for all packages.
default-members = ["crates/sruja-cli"]
members = [
    # Core
    "crates/sruja-types",
    "crates/sruja-diagnostics",
    "crates/sruja-language",
    "crates/sruja-engine",
    "crates/sruja-export",
    "crates/sruja-cli",
    "crates/sruja-scan",
    "crates/sruja-diff",
    # Product
    "crates/sruja-graph",
    "crates/sruja-mcp",
    "crates/sruja-semantic",
    "crates/sruja-intent",
    "crates/sruja-report",
    "crates/sruja-lsp",
    "crates/sruja-wasm",
]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2021"
authors = ["Sruja Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sruja-ai/sruja"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
nom = { version = "7", features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "full"] }
tower-lsp = "0.20"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
