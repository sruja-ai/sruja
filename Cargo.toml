[workspace]
# Default package for `cargo build`/`cargo test` at workspace root.
# Use `cargo build --workspace` or `cargo test --workspace` for all packages.
default-members = ["crates/sruja-cli"]
members = [
    # Tier 1: Core Context Graph Engine
    "crates/sruja-diagnostics",
    "crates/sruja-language",
    "crates/sruja-engine",
    "crates/sruja-export",
    "crates/sruja-scan",
    "crates/sruja-graph-core",
    "crates/sruja-graph",
    "crates/sruja-extract",

    # Tier 2: Delivery Layer
    "crates/sruja-wasm",
    "crates/sruja-cli",

    # Tier 3: Secondary Products
    "crates/sruja-diff",
    "crates/sruja-intent",
    "crates/sruja-agent",
    "crates/sruja-memory",
    "crates/sruja-compress",
]
resolver = "2"

[workspace.package]
version = "0.65.0"
edition = "2021"
authors = ["Sruja Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sruja-ai/sruja"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
nom = { version = "8", features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "full"] }
clap = { version = "4.6", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
proptest = "1.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "serde", "js"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
scip = "0.7.0"
protobuf = "3"
prost = "0.13"
prost-types = "0.13"
fastembed = "5.0"
hnsw_rs = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
toml = "1"
futures = "0.3"
async-stream = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
