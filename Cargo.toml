[workspace]
members = [
    "crates/sruja-diagnostics",
    "crates/sruja-language",
    "crates/sruja-engine",
    "crates/sruja-export",
    "crates/sruja-lsp",
    "crates/sruja-cli",
    "crates/sruja-wasm",
    "crates/skill-lint",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["Sruja Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sruja-ai/sruja"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nom = { version = "7", features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "full"] }
tower-lsp = "0.20"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
