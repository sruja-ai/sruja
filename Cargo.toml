[workspace]
members = [
    "crates/sruja-diagnostics",
    "crates/sruja-language",
    "crates/sruja-engine",
    "crates/sruja-export",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sruja Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sruja-ai/sruja"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nom = { version = "7", features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
