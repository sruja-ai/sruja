[package]
name = "sruja-extract"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Architecture extraction engine for Sruja conversations"

[dependencies]
sruja-graph = { path = "../sruja-graph" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# LLM extraction (required - no pattern fallback)
rig = { package = "rig-core", version = "0.31", default-features = false, features = ["reqwest-rustls"] }
tokio = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
