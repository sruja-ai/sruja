[package]
name = "sruja-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for Sruja DSL - architecture as code tool"

[[bin]]
name = "sruja"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
sruja-diagnostics = { path = "../sruja-diagnostics" }
sruja-language = { path = "../sruja-language" }
sruja-engine = { path = "../sruja-engine" }
sruja-export = { path = "../sruja-export" }
sruja-scan = { path = "../sruja-scan" }
sruja-diff = { path = "../sruja-diff" }
sruja-graph = { path = "../sruja-graph" }
sruja-intent = { path = "../sruja-intent" }
sruja-agent = { path = "../sruja-agent" }
sruja-memory = { path = "../sruja-memory" }
sruja-extract = { path = "../sruja-extract" }
clap = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
colored = "2.2.0"
indicatif = "0.18"
notify = "6.1.1"
notify-debouncer-mini = "0.4.1"
clap_complete = "4.5"
console = "0.15"
dialoguer = "0.11"
crossterm = "0.28"
opener = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "3", features = ["json"] }
toml = "0.8"
blake3 = "1.5"
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3.27"
assert_cmd = "2.0"
predicates = "3.1"
