[package]
name = "sruja-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for Sruja DSL - architecture as code tool"

[[bin]]
name = "sruja"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
sruja-diagnostics = { path = "../sruja-diagnostics" }
sruja-language = { path = "../sruja-language" }
sruja-engine = { path = "../sruja-engine" }
sruja-export = { path = "../sruja-export" }
sruja-scan = { path = "../sruja-scan" }
sruja-diff = { path = "../sruja-diff" }
sruja-graph = { path = "../sruja-graph" }
sruja-intent = { path = "../sruja-intent" }
sruja-report = { path = "../sruja-report" }
clap = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.2.0"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.27"
