[package]
name = "sruja-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["llm-openai", "llm-anthropic", "tools-fs"]
llm-openai = ["dep:reqwest"]
llm-anthropic = ["dep:reqwest"]
tools-fs = []
compression = ["dep:sruja-compress"]
mcp-client = ["dep:rmcp"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
toml.workspace = true
sruja-graph = { path = "../sruja-graph" }
sruja-compress = { path = "../sruja-compress", optional = true }
fs2 = "0.4.3"
reqwest = { workspace = true, optional = true, features = ["stream"] }
futures.workspace = true
async-stream.workspace = true
rmcp = { version = "1.7", default-features = false, optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
tempfile = "3.10"
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
