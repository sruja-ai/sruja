[package]
name = "sruja-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["llm-openai", "llm-anthropic", "tools-fs"]
# LLM provider backends.
llm-openai = ["dep:reqwest"]
llm-anthropic = ["dep:reqwest"]
# Built-in filesystem / shell tools.
tools-fs = []
# SQLite memory search backend (enables FTS5+BM25 ranked retrieval via sruja-memory).
memory-sqlite = []
# MCP client support (connects to external MCP servers).
mcp-client = ["dep:rmcp"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
toml.workspace = true
sruja-diagnostics = { path = "../sruja-diagnostics" }
sruja-graph = { path = "../sruja-graph" }
sruja-language = { path = "../sruja-language" }
fs2 = "0.4.3"
reqwest = { workspace = true, optional = true }
rmcp = { version = "1.7", default-features = false, optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
tempfile = "3.10"
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
