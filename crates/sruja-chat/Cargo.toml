[package]
name = "sruja-chat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-party chat system for Sruja architecture discussions"

[dependencies]
rig = { package = "rig-core", version = "0.31", default-features = false, features = ["reqwest-rustls"] }
sruja-graph = { path = "../sruja-graph" }
sruja-extract = { path = "../sruja-extract" }
sruja-scan = { path = "../sruja-scan" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
dirs = "5.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
