[package]
name = "sruja-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Sruja DSL parser and validation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sruja-language = { path = "../sruja-language" }
sruja-engine = { path = "../sruja-engine", default-features = false }
sruja-export = { path = "../sruja-export" }
sruja-diagnostics = { path = "../sruja-diagnostics" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
console_error_panic_hook = "0.1"
