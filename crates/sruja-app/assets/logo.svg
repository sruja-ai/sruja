<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DB2777"/>
      <stop offset="100%" style="stop-color:#e84a8f"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#grad)"/>
  
  <!-- S letter -->
  <text x="32" y="46" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="40" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle">S</text>
  
  <!-- Architecture blocks -->
  <rect x="12" y="44" width="10" height="6" rx="1" fill="rgba(255,255,255,0.3)"/>
  <rect x="27" y="44" width="10" height="6" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="42" y="44" width="10" height="6" rx="1" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Connection dots -->
  <circle cx="17" cy="52" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="32" cy="52" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="47" cy="52" r="2" fill="rgba(255,255,255,0.6)"/>
  
  <!-- Connection line -->
  <line x1="17" y1="52" x2="47" y2="52" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
</svg>
