[package]
name = "sruja-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server for exposing Sruja architecture knowledge"

[dependencies]
sruja-graph = { path = "../sruja-graph" }
sruja-scan = { path = "../sruja-scan" }
sruja-diff = { path = "../sruja-diff" }
sruja-semantic = { path = "../sruja-semantic" }
sruja-report = { path = "../sruja-report" }
sruja-intent = { path = "../sruja-intent" }
sruja-language = { path = "../sruja-language" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
