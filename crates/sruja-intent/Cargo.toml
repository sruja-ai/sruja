[package]
name = "sruja-intent"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Intent vs Reality comparison for Sruja architecture intelligence"

[dependencies]
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
walkdir = "2.4"

sruja-scan = { path = "../sruja-scan" }
sruja-language = { path = "../sruja-language" }

[dev-dependencies]
tempfile = "3.10"
