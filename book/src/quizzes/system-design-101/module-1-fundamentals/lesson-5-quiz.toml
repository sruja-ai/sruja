# Quiz for System Design 101 - Module 1, Lesson 5: User Scenarios
# Tests understanding of user journeys, scenario modeling, and practical flows

[[questions]]
type = "ShortAnswer"
prompt.prompt = "In system design, what term describes the series of steps a user takes to achieve a specific goal within your system?"
answer.answer = "User scenario"
answer.alternatives = ["scenario", "user journey", "user flow"]
context = """
A user scenario (or user journey) describes the sequence of actions a user performs to accomplish a goal.
Example: "User searches for events → selects ticket → enters payment → system processes payment → receives confirmation"
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "Why is modeling user scenarios important in system design?"
prompt.distractors = [
  "To make architecture diagrams look more complex and impressive",
  "To replace static diagrams entirely with dynamic visualizations",
  "To document every possible button click and mouse movement"
]
answer.answer = "To validate that components exist and are connected, clarify behavior, and serve as test blueprints"
context = """
Modeling user scenarios provides three key benefits:
1. Validation - Ensures required components and connections exist
2. Clarity - Helps stakeholders understand system behavior
3. Testing - Provides blueprints for integration and E2E tests
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What's the difference between static architecture diagrams and user scenarios?"
prompt.distractors = [
  "Architecture diagrams show user actions, scenarios show server structure",
  "They're the same thing, just different names",
  "Architecture diagrams are only for developers, scenarios are only for managers"
]
answer.answer = "Architecture diagrams show structure, user scenarios show behavior"
context = """
Static diagrams: Show components, connections, and system structure (the "what")
User scenarios: Show flows, sequences, and behavior (the "how")
Both are complementary - architecture provides the structure, scenarios illustrate how users interact with that structure.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "In Sruja, what keyword is used to model user scenarios and interactions explicitly?"
prompt.distractors = [
  "flow",
  "journey",
  "path"
]
answer.answer = "scenario"
context = """
In Sruja, use the `scenario` keyword to model user interactions:

```sruja
BuyTicket = scenario "User purchases a concert ticket" {
    User -> TicketingApp.WebApp "Selects ticket"
    TicketingApp.WebApp -> TicketingApp.PaymentService "Process payment"
    // ...
}
```

This makes user flows explicit and generates sequence diagrams.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "A user scenario for buying a product includes: 'User searches → Selects product → Adds to cart → Checkout → Payment → Confirmation'. What's the best way to validate this scenario?"
prompt.distractors = [
  "Ask users if they remember seeing these steps",
  "Check if the marketing website mentions these features",
  "Verify the architecture diagram has boxes named appropriately"
]
answer.answer = "Trace the scenario through architecture to ensure each step has corresponding components and connections"
context = """
Validation means ensuring every step in the scenario maps to actual components:
- Search → Search Service exists
- Select product → Product API exists
- Add to cart → Cart Service exists
- Checkout → Payment Service exists
- Payment → Payment Gateway exists
- Confirmation → Notification Service exists

And that these components are properly connected.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "You're designing an e-commerce platform. A user scenario is: 'Guest user adds item to cart → Creates account → Completes purchase'. What architecture challenge does this scenario highlight?"
prompt.distractors = [
  "The need for a guest checkout feature (simpler flow)",
  "The database needs to store product images",
  "The payment processor requires SSL certificates"
]
answer.answer = "Cart state must persist across anonymous-to-authenticated user transition"
context = """
This scenario requires handling user identity transition:
- Anonymous cart stored by session ID or device ID
- When user creates account, cart must be migrated to user ID
- Cart service must handle both anonymous and authenticated requests
- Requires careful state management and data migration logic
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "A banking app has this scenario: 'User initiates transfer → System validates balance → System processes transfer → System updates both accounts → System sends notification'. What happens if the notification system is down?"
prompt.distractors = [
  "The transfer fails and is rolled back to prevent inconsistency",
  "The money transfer is cancelled and funds returned",
  "The entire banking system goes offline"
]
answer.answer = "The transfer succeeds, but notification is queued or logged for later delivery"
context = """
This illustrates idempotent operations and fault tolerance:
- Notification is not critical path for core transaction
- Transfer can succeed even if notification fails
- Notification queue ensures eventual delivery
- Separation of concerns: core banking vs notification service
- Good design: critical operations succeed regardless of non-critical dependencies
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "Why are user scenarios valuable for testing?"
prompt.distractors = [
  "They replace the need for unit tests",
  "They're only useful for manual exploratory testing",
  "They help developers write better code comments"
]
answer.answer = "They serve as blueprints for integration tests and end-to-end tests"
context = """
User scenarios provide test specifications:
- Each scenario step becomes a test assertion
- Integration tests verify component interactions
- E2E tests verify complete user journeys
- Scenarios ensure critical user paths are tested
- They help prioritize which flows need testing coverage
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "You're designing a ride-sharing app. User scenario: 'User requests ride → System finds nearby driver → Driver accepts → User sees driver location → Ride completes → Payment processed'. What component is most critical for this scenario to work?"
prompt.distractors = [
  "User profile database",
  "Ride history logs",
  "Marketing email system"
]
answer.answer = "Real-time location tracking and matching service"
context = """
The critical components for ride-sharing are:
- Real-time driver location (GPS tracking)
- Matching algorithm (find nearest available driver)
- Location push to user (show driver arriving)
- Payment processing (core business transaction)

Without real-time location and matching, the service doesn't work.
User profiles and ride history are important but not core to the ride request flow.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "In Sruja, how would you model a scenario where a user interacts with multiple systems?"
prompt.distractors = [
  "Create separate scenarios for each system",
  "Use a single component to represent all systems combined",
  "Scenarios can only model single-system interactions"
]
answer.answer = "Define all systems and containers, then create a scenario with steps crossing system boundaries"
context = """
In Sruja, scenarios can span multiple systems:

```sruja
User = person "Customer"
ECommerce = system "E-Commerce Platform" {
    WebApp = container "Web Frontend"
}
PaymentGateway = system "Payment Provider" {
    API = container "Payment API"
}

CompletePurchase = scenario "Buy product with payment" {
    User -> ECommerce.WebApp "Places order"
    ECommerce.WebApp -> PaymentGateway.API "Process payment"
    PaymentGateway.API -> User "Payment confirmation"
}
```

This shows the complete flow across system boundaries.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "A food delivery app scenario: 'User browses restaurants → Selects restaurant → Browses menu → Adds items → Places order → Order assigned to driver → Driver picks up → Driver delivers → User rates order'. How would you split this into multiple scenarios?"
prompt.distractors = [
  "One giant scenario covering everything (too complex)",
  "Separate scenario for each button click (too granular)",
  "Only model the happy path, ignore alternatives"
]
answer.answer = "Separate scenarios: Browse & Order (user-facing), Order Fulfillment (driver-facing), Rating (feedback)"
context = """
Good scenario design separates concerns:
1. **Browse & Order**: User interactions (browse, select, add, place order)
2. **Order Fulfillment**: Backend operations (assign driver, pickup, delivery)
3. **Rating & Feedback**: Post-delivery experience

Each scenario has different actors, stakeholders, and failure modes.
This makes validation, testing, and communication clearer.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What's the difference between a 'happy path' scenario and an 'error path' scenario?"
prompt.distractors = [
  "Happy path is for happy customers, error path is for angry customers",
  "Happy path is always shorter, error path is always longer",
  "There's no difference - all scenarios are the same"
]
answer.answer = "Happy path shows successful completion, error path shows how system handles failures"
context = """
Happy Path Scenario:
- Everything works as designed
- All components respond correctly
- User achieves their goal

Error Path Scenario:
- Something fails (network down, payment declined, service unavailable)
- System handles the error gracefully
- User gets helpful feedback or alternative options

Both should be modeled to ensure system robustness.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "You're designing a video streaming service. Happy path: 'User selects video → Video loads → User watches → System recommends next video'. What error paths should you also model?"
prompt.distractors = [
  "None - only happy path matters for streaming",
  "Only model if the user decides to cancel subscription",
  "All possible technical error codes and stack traces"
]
answer.answer = "Video not found, network timeout, playback error, subscription expired, content unavailable in region"
context = """
Critical error paths to model:
1. Video not found (404 or database mismatch)
2. Network timeout (slow connection)
3. Playback error (corrupt video, codec issues)
4. Subscription expired (access denied)
5. Geo-restriction (content unavailable in region)

Each error path should have:
- Detection mechanism
- User-friendly error message
- Fallback or retry logic
- Logging for debugging
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "How do user scenarios help with stakeholder communication?"
prompt.distractors = [
  "They replace technical documentation for executives",
  "They only matter to developers and QA engineers",
  "They make diagrams prettier for presentations"
]
answer.answer = "They translate technical architecture into business-friendly descriptions of user value"
context = """
Stakeholder benefits:
- Product managers: Understand feature requirements and dependencies
- Business stakeholders: See how users achieve goals with the system
- Designers: Understand user flows and touchpoints
- Support teams: Know what to expect and how to troubleshoot
- Investors: Understand the value proposition and user experience

Scenarios bridge the gap between technical architecture and business value.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "In a microservices architecture, why is modeling user scenarios especially important?"
prompt.distractors = [
  "Microservices don't need modeling because they're simple",
  "Scenarios are only important for monolithic applications",
  "Microservices automatically generate scenarios from code"
]
answer.answer = "Complex distributed interactions across services make it hard to see complete user flows"
context = """
Microservices challenges that scenarios address:
1. **Distributed complexity**: Multiple services collaborate for one user action
2. **Hidden dependencies**: Service A calls B which calls C - hard to see in code
3. **Failure cascades**: One service failure breaks entire user journey
4. **Data consistency**: Data scattered across multiple services
5. **Performance bottlenecks**: Latency accumulates across service boundaries

Scenarios make these distributed flows visible and testable.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "A social media app scenario: 'User posts content → Content stored → Followers' timelines updated → Notifications sent'. If the notification service is slow, what should happen?"
prompt.distractors = [
  "Post should be rejected until notification service is faster",
  "Post succeeds, but followers can't see the content until notifications sent",
  "Post succeeds immediately, notifications sent asynchronously"
]
answer.answer = "Post succeeds immediately, notifications sent asynchronously (eventual delivery)"
context = """
This illustrates decoupling and eventual consistency:
- Core action (posting) should not be blocked by non-critical services
- Notifications are important but not time-critical
- Asynchronous processing ensures core experience is fast
- Queue-based architecture handles notification backlog
- Eventual consistency is acceptable for notification delivery

Pattern: Core path (sync) + Secondary path (async)
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What's the relationship between user scenarios and API design?"
prompt.distractors = [
  "No relationship - they're independent concerns",
  "APIs are designed first, then scenarios created to match",
  "Scenarios replace the need for API documentation"
]
answer.answer = "Scenarios inform API endpoints needed, and API contracts enable scenario implementation"
context = """
Scenarios and APIs are complementary:
- Scenarios identify: What operations users need to perform
- API design defines: How those operations are exposed as endpoints
- Scenarios validate: Are there enough endpoints to support user flows?
- API contracts specify: Request/response formats for each step

Good process:
1. Define user scenarios (what users want to do)
2. Design APIs to enable those scenarios (how system supports it)
3. Validate scenarios can be implemented with available APIs
4. Test scenarios end-to-end with real API calls
"""

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What type of diagram is automatically generated from user scenarios in Sruja to show sequence of interactions?"
answer.answer = "Sequence diagram"
answer.alternatives = ["sequence diagram", "sequence", "sequence diagrams"]
context = """
Sruja's scenario keyword enables automatic generation of sequence diagrams that show:
- Actors (users, systems, containers) involved
- Order of interactions (message flow)
- Request/response relationships
- Parallel and sequential operations

Sequence diagrams make user flows visual and easy to understand.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "You're onboarding a new developer to your team. What's the most effective way to use user scenarios for onboarding?"
prompt.distractors = [
  "Have them memorize all scenario names and steps",
  "Tell them scenarios are not important, just read the code",
  "Only show them database schemas and API documentation"
]
answer.answer = "Walk through key scenarios to show how the system works from user perspective, then dive into implementation"
context = """
Effective onboarding with scenarios:
1. Start with high-level: "Here are the main things users do with our system"
2. Walk through 2-3 key scenarios: Show flow from user's point of view
3. Map scenario steps to components: "This step uses this service"
4. Show code implementation: "Here's where this happens in the code"
5. Encourage tracing: "Follow this scenario through the codebase"

This gives new developers both big-picture understanding and concrete implementation knowledge.
"""

[[questions]]
type = "MultipleChoice"
prompt.prompt = "A healthcare app has this scenario: 'Patient books appointment → Doctor receives notification → Appointment confirmed → Patient receives confirmation → System updates medical records'. What regulatory requirement might influence this scenario?"
prompt.distractors = [
  "System must confirm appointment within 1 second",
  "Doctor must accept appointment within 5 minutes",
  "All patient data must be encrypted and logged for audit"
]
answer.answer = "HIPAA compliance requiring data privacy, access logging, and audit trails"
context = """
Healthcare scenarios must account for:
- Data encryption (at rest and in transit)
- Access controls (who can view appointments)
- Audit logging (every action logged)
- Data retention (how long records are kept)
- Privacy (no unnecessary data exposure)
- Backup and recovery (HIPAA-specific RPO/RTO)

Regulatory requirements often add steps to technical scenarios:
"System logs access → Audit trail recorded → Backup created"
"""
