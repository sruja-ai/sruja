# Skill manifest for agent platforms. Version aligns with Sruja repo release (see repo tag / GitHub Release).
name: sruja-architecture
description: Architecture discovery and DSL authoring for Sruja. This skill provides a deterministic, evidence-first workflow for generating and maintaining repo.sruja files (architecture.sruja supported for backward compatibility) from codebases.

# When the skill runs, it invokes sruja discover/sync/lint/drift. The user needs the Sruja CLI for that; the skill can guide them to install it (curl -fsSL https://sruja.ai/install.sh | bash) if missing. Not a prerequisite before adding the skill—install skill first, then CLI when needed. Extension optional.
prerequisites: "When you use the skill, it runs sruja discover, sync, lint, and drift. Have the Sruja CLI installed (the skill will tell you how if it's missing): curl -fsSL https://sruja.ai/install.sh | bash. Prefer .sruja/context.json when present; when not, the skill runs discover/sync behind the scenes. If 'sruja --help' does not list sync and discover, upgrade the CLI (see SKILL.md Troubleshooting). Optional: Sruja VS Code extension for in-editor lint and diagram preview."

capabilities:
  - Architecture discovery from codebases
  - DSL authoring and validation
  - Evidence-first modeling
  - Drift detection and refinement

prompts:
  default: "Use sruja-architecture skill. Run `sruja sync -r .` (or `sruja discover --context -r . --format json`), gather evidence from the repo, ask targeted questions only if scope or externals are unclear, generate a minimal repo.sruja with evidence-based components and relationships using C4 context and container levels, then run `sruja lint repo.sruja` and fix all errors until it passes. Do not guess about missing information; list open questions instead."

  discovery: "Use sruja-architecture skill. Run `sruja sync -r .` or `sruja discover --context -r . --format json`, gather evidence from the repo including structure, technologies, modules, entry points, and dependencies. Ask targeted questions only when evidence is ambiguous. Generate a minimal repo.sruja covering only what evidence supports. Run `sruja lint repo.sruja` and fix all errors."

  refinement: "Use sruja-architecture skill. Analyze this existing repo.sruja (or architecture.sruja), run `sruja sync -r .` or `sruja discover --context -r . --format json` for current evidence, compare architecture against evidence, identify discrepancies, propose updates to align with current code, then run `sruja lint repo.sruja` and fix all errors."

  drift: "Use sruja-architecture skill. Run `sruja drift -r .` (auto-detects repo.sruja / architecture.sruja) or `sruja drift -r . -a repo.sruja --format json` to detect drift. Analyze results, propose updates to repo.sruja to address drift, run `sruja lint repo.sruja` and fix all errors. List open questions for any uncertainties."

references:
  - SKILL.md
  - REFERENCE.md
  - PROMPTS.md
  - AGENTS.md

installation: "npx skills add https://github.com/sruja-ai/sruja --skill sruja-architecture"

category: architecture
tags:
  - architecture
  - dsl
  - c4
  - modeling
  - discovery
  - validation
