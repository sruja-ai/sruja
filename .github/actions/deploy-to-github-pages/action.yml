name: "Deploy to GitHub Pages"
description: "Deploy site contents to a GitHub Pages repository"
inputs:
  site-path:
    description: "Path to the site contents to deploy"
    required: true
  target-repo:
    description: "Target repository name (e.g. sruja-website); owner is sruja-ai"
    required: true
  target-branch:
    description: "Target branch to deploy to"
    required: false
    default: "main"
  app-id:
    description: "GitHub App ID (from secrets)"
    required: true
  app-private-key:
    description: "GitHub App private key (from secrets)"
    required: true
  commit-message:
    description: "Commit message (can include github.ref_name and github.sha if expanded by calling workflow)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: sruja-ai
        repositories: ${{ inputs.target-repo }}

    - name: Get GitHub App User ID
      id: get-user-id
      shell: bash
      run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}

    - name: Checkout target repo
      uses: actions/checkout@v6
      with:
        repository: sruja-ai/${{ inputs.target-repo }}
        ref: ${{ inputs.target-branch }}
        token: ${{ steps.app-token.outputs.token }}
        path: target

    - name: Verify checkout succeeded
      shell: bash
      run: |
        if [ ! -d "target" ]; then
          echo "Error: Checkout failed - target directory not found"
          echo "Repository: sruja-ai/${{ inputs.target-repo }}"
          exit 1
        fi
        if [ ! -d "target/.git" ]; then
          echo "Error: Checkout failed - target/.git directory not found"
          echo "Repository: sruja-ai/${{ inputs.target-repo }}"
          echo "This may indicate the repository doesn't exist or the token lacks access"
          exit 1
        fi
        # Verify it's actually a git repository
        cd target
        if ! git rev-parse --git-dir > /dev/null 2>&1; then
          echo "Error: target directory exists but is not a valid git repository"
          echo "Repository: sruja-ai/${{ inputs.target-repo }}"
          exit 1
        fi
        echo "✅ Checkout verified - git repository is valid"

    - name: Copy site contents
      shell: bash
      run: |
        # If site-path ends with /designer, deploy to target/designer
        if [[ "${{ inputs.site-path }}" == *"/designer" ]]; then
          rm -rf target/designer
          cp -r ${{ inputs.site-path }} target/designer
        else
          # Capture CNAME if it exists in the target repo
          if [ -f "target/CNAME" ]; then
            cp target/CNAME ./target_CNAME
            HAS_CNAME=true
          else
            HAS_CNAME=false
          fi

          # Remove existing contents except .git
          find target -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          # Copy all contents including assets directory and hidden files
          # Using cp -a to preserve all attributes and copy everything
          cp -a ${{ inputs.site-path }}/. target/

          # Restore CNAME if it existed
          if [ "$HAS_CNAME" = true ]; then
            cp ./target_CNAME target/CNAME
            echo "✅ CNAME restored"
          fi

          # Verify site structure: mdBook has index.html at root (no Astro)
          if [ -f "target/index.html" ]; then
            echo "✅ Site structure verified (mdBook)"
          else
            echo "❌ Error: Unrecognized site structure after copy"
            echo "Expected: index.html at root (mdBook output)"
            echo "Source directory contents:"
            ls -la ${{ inputs.site-path }}/
            echo "Target directory contents:"
            ls -la target/
            exit 1
          fi
          # Ensure .nojekyll exists to prevent Jekyll from processing underscore directories
          touch target/.nojekyll

          # Copy dual-license texts from main repo (MIT OR Apache-2.0). Root has LICENSE-APACHE + LICENSE-MIT,
          # not a single LICENSE file — GitHub license detection on Pages repos will see these after deploy.
          WS="${GITHUB_WORKSPACE:-$(pwd)}"
          LICENSE_COPIED=false
          if [ -f "$WS/LICENSE-APACHE" ]; then
            cp "$WS/LICENSE-APACHE" target/LICENSE-APACHE
            echo "✅ LICENSE-APACHE copied"
            LICENSE_COPIED=true
          fi
          if [ -f "$WS/LICENSE-MIT" ]; then
            cp "$WS/LICENSE-MIT" target/LICENSE-MIT
            echo "✅ LICENSE-MIT copied"
            LICENSE_COPIED=true
          fi
          if [ "$LICENSE_COPIED" = true ]; then
            cat > target/LICENSE << 'EOF'
SPDX-License-Identifier: MIT OR Apache-2.0

This repository contains built static files deployed from the main Sruja project.
Full license texts: see LICENSE-APACHE and LICENSE-MIT in this repository.
EOF
            echo "✅ LICENSE (SPDX pointer) written"
          elif [ -f "$WS/LICENSE" ]; then
            cp "$WS/LICENSE" target/LICENSE
            echo "✅ LICENSE copied (single file)"
          else
            echo "⚠️  No LICENSE-APACHE / LICENSE-MIT (or LICENSE) at workspace root — website repo will lack license files"
          fi
        fi

    - name: Create deployment README
      shell: bash
      run: |
        # Only create README for root site deployments, not for designer subdirectory.
        # Use a checked-in template so Markdown is valid (no YAML-indented heredoc) and bash EOF rules are trivial.
        if [[ "${{ inputs.site-path }}" != *"/designer" ]]; then
          TPL="${GITHUB_WORKSPACE}/.github/templates/github-pages-deployment-readme.md"
          if [ ! -f "$TPL" ]; then
            echo "::error::Missing README template: $TPL"
            exit 1
          fi
          cp "$TPL" target/README.md
          echo "✅ Created deployment README from template"
        else
          echo "⏭️  Skipping README creation (designer subdirectory deployment)"
        fi

    - name: Configure git
      working-directory: target
      shell: bash
      run: |
        git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
        git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

    - name: Commit and push
      working-directory: target
      shell: bash
      run: |
        git add -A
        if git diff --cached --quiet; then 
          echo "No changes to deploy"
        else 
          COMMIT_MSG="${{ inputs.commit-message }}"
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:${{ inputs.target-branch }}
        fi
