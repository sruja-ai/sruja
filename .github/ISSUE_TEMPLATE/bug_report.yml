name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in as much as you can so we can reproduce and fix.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: CLI version (`sruja --version`) or extension version
      placeholder: e.g. 0.1.0 or VS Code extension 0.x

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - VS Code extension
        - Parser / DSL
        - Export (JSON/Markdown/Mermaid)
        - Docs (book)
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, `.sruja` snippet (if relevant)
      required: false
