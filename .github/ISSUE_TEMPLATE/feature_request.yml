name: Feature request
description: Suggest a new feature or improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature and how it fits Sruja's scope (architecture-as-code, not a diagramming product). See [PRINCIPLES.md](https://github.com/sruja-ai/sruja/blob/main/PRINCIPLES.md) and [SCOPE.md](https://github.com/sruja-ai/sruja/blob/main/docs/SCOPE.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Who is it for?
      placeholder: e.g. "As a user of the CLI I want to ... so that ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like
      placeholder: |
        - New DSL syntax / CLI flag / export format / ...
        - How it should behave
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - VS Code extension
        - DSL / language
        - Export
        - Docs / book
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about
      required: false
