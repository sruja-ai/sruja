# Publish VS Code extension to Open VSX and/or Visual Studio Marketplace.
# To run now: Actions → Publish extension to Open VSX → Run workflow (optional: set version input).
# Also runs when a release is published (trigger-extension-publish.yml calls this) or when you push a tag v* from your machine.
# Secrets: OPEN_VSX_TOKEN, AZURE_DEVOPS_PAT (Azure DevOps PAT with Marketplace → Manage).
name: Publish extension to Open VSX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version (e.g. 0.3.5). Leave empty to use package.json."
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Extension version (e.g. 0.3.5)."
        required: true
        type: string
    secrets:
      OPEN_VSX_TOKEN:
        required: false
      AZURE_DEVOPS_PAT:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build and publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set extension version
        run: |
          # Prefer explicit version from workflow_call/workflow_dispatch so we never use branch ref (e.g. main).
          if [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
            echo "Using input version (raw): $RAW"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            # Only use ref_name if it looks like a version tag (v* or sruja-v*); ignore branch names like main.
            REF="${{ github.ref_name }}"
            if [[ "$REF" =~ ^(v[0-9]|sruja-v) ]]; then
              RAW="$REF"
              echo "Using pushed tag version (raw): $RAW"
            else
              RAW=""
              echo "Ref '$REF' is not a version tag; will use package.json if no other version set."
            fi
          else
            RAW=""
          fi
          # Normalize: strip tag prefix (e.g. sruja-v0.7.1 -> v0.7.1) then strip v
          if [ -n "$RAW" ]; then
            VERSION="$RAW"
            VERSION="${VERSION#sruja-}"
            VERSION="${VERSION#v}"
            echo "Normalized version: $VERSION"
          else
            VERSION=""
          fi
          # Validate version is semver (major.minor.patch); vsce rejects e.g. "main"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            if [ -n "$VERSION" ]; then
              echo "::error::Invalid version format '$RAW' -> '$VERSION'. Expected semver (e.g., 1.2.3 or sruja-v0.7.1)"
            else
              echo "No version input; checking extension/package.json..."
              VERSION=$(cd extension && npm pkg get version --omit=optional | sed 's/"//g')
              echo "package.json version: $VERSION"
            fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Extension version must be semver (major.minor.patch). Got: '$VERSION'. Fix extension/package.json or pass a valid version."
              exit 1
            fi
          fi
          (cd extension && npm pkg set version="$VERSION")
          echo "Set extension version to $VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install wasm-opt (binaryen, for smaller extension WASM)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen

      - name: Install extension dependencies
        run: |
          cd extension
          npm install

      - name: Copy WASM and LICENSE into extension
        run: bash extension/scripts/copy-assets.sh

      - name: Compile extension
        run: npm run compile
        working-directory: extension

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: extension

      - name: Publish to Open VSX Registry
        continue-on-error: true
        run: |
          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "OPEN_VSX_TOKEN not set - skipping Open VSX publish"
            exit 0
          fi
          npx --yes ovsx publish extension/*.vsix --pat "$OPEN_VSX_TOKEN"
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        run: |
          if [ -z "$AZURE_DEVOPS_PAT" ]; then
            echo "AZURE_DEVOPS_PAT not set - skipping Visual Studio Marketplace"
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --skip-duplicate --pat "$AZURE_DEVOPS_PAT"
        working-directory: extension
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
