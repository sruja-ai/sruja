# Publish VS Code extension to Open VSX and/or Visual Studio Marketplace.
# To run now: Actions → Publish extension to Open VSX → Run workflow (optional: set version input).
# Also runs when a release is published (trigger-extension-publish.yml calls this) or when you push a tag v* from your machine.
# Secrets: OPEN_VSX_TOKEN, AZURE_DEVOPS_PAT (Azure DevOps PAT with Marketplace → Manage).
name: Publish extension to Open VSX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version (e.g. 0.3.5). Leave empty to use package.json."
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Extension version (e.g. 0.3.5)."
        required: true
        type: string
    secrets:
      OPEN_VSX_TOKEN:
        required: false
      AZURE_DEVOPS_PAT:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set extension version
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "Using workflow_call version: $VERSION"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "Using pushed tag version: $VERSION"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            echo "Using version from package.json"
            exit 0
          fi
          [ -z "$VERSION" ] || (cd extension && npm pkg set version="$VERSION")

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install wasm-opt (binaryen, for smaller extension WASM)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen

      - name: Install extension dependencies
        run: |
          cd extension
          npm install

      - name: Copy WASM and LICENSE into extension
        run: bash extension/scripts/copy-assets.sh

      - name: Compile extension
        run: npm run compile
        working-directory: extension

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: extension

      - name: Publish to Open VSX Registry
        continue-on-error: true
        run: |
          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "OPEN_VSX_TOKEN not set - skipping Open VSX publish"
            exit 0
          fi
          npx --yes ovsx publish extension/*.vsix --pat "$OPEN_VSX_TOKEN"
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        run: |
          if [ -z "$AZURE_DEVOPS_PAT" ]; then
            echo "AZURE_DEVOPS_PAT not set - skipping Visual Studio Marketplace"
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --pat "$AZURE_DEVOPS_PAT"
        working-directory: extension
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
