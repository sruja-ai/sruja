# Run tests with coverage and upload to Codecov.
# Flags: typescript (extension), rust (crates)
# Overall coverage combines both flags.
name: Codecov

on:
  push:
    branches: [main, develop, simplify]
  pull_request:
    branches: [main, develop, simplify]

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typescript:
    name: TypeScript coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Build WASM (Node.js target)
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          cd crates/sruja-wasm && wasm-pack build --target nodejs --out-dir pkg --release
          mkdir -p extension/wasm
          cp pkg/sruja_wasm.js pkg/sruja_wasm_bg.wasm extension/wasm/
          ls -la extension/wasm/
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text-summary
        working-directory: extension

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: extension/coverage
          flags: typescript
          fail_ci_if_error: false
          name: codecov-typescript
          verbose: true

  rust:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --exclude-from-report sruja-wasm

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
          name: codecov-rust
          verbose: true
