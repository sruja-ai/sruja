# Optional CI gate for PRs labeled aidlc-workflow (Sruja workflow + drift).
name: Sruja AIDLC workflow gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  aidlc-gate:
    if: contains(github.event.pull_request.labels.*.name, 'aidlc-workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sruja CLI
        run: cargo build --release -p sruja-cli

      - name: Workflow status check
        run: ./target/release/sruja workflow status -r . --check
        continue-on-error: false

      - name: Drift check
        run: ./target/release/sruja drift -r . -a repo.sruja --format json
        # Enterprise default: enforce drift for AI-DLC workflow PRs.
        # If you want an advisory rollout, use `drift-pr` (PR-only new violations) in your CI template
        # or run drift in advisory mode outside this workflow.
        continue-on-error: false
