name: Skill Files PR Check

on:
  pull_request:
    paths:
      - "skills/**"
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: skill-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-pr-check:
    name: Validate changed skill files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      files-changed: ${{ steps.changed-files.outputs.any_changed }}
      changed-files: ${{ steps.changed-files.outputs.all_changed_files }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check for skill-lint package
        id: skill_lint
        run: |
          if cargo build --release -p skill-lint 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: skills/**/*.md
          files_separator: " "

      - name: List changed skill files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed skill files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Check links in changed files
        if: steps.skill_lint.outputs.present == 'true' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -e
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$file" ]; then
              echo "::group::Checking links in $file"
              ./target/release/skill-lint check-links "$file" || {
                echo "::warning file=$file::Link check failed"
              }
              echo "::endgroup::"
            fi
          done

      - name: Check cross-references in changed files
        if: steps.skill_lint.outputs.present == 'true' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -e
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$file" ]; then
              echo "::group::Checking cross-references in $file"
              ./target/release/skill-lint check-xrefs "$file" || {
                echo "::warning file=$file::Cross-reference check failed"
              }
              echo "::endgroup::"
            fi
          done

      - name: Test code examples in changed files
        if: steps.skill_lint.outputs.present == 'true' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -e
          failed=0
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$file" ]; then
              echo "::group::Testing code examples in $file"
              ./target/release/skill-lint test "$file" || {
                echo "::error file=$file::Code test failed"
                failed=1
              }
              echo "::endgroup::"
            fi
          done
          if [ $failed -eq 1 ]; then
            exit 1
          fi

      - name: Check formatting of changed files
        if: steps.skill_lint.outputs.present == 'true' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -e
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$file" ]; then
              echo "::group::Checking format of $file"
              ./target/release/skill-lint format --check "$file" || {
                echo "::error file=$file::Format check failed"
                echo "To fix: cargo run -p skill-lint -- format '$file'"
              }
              echo "::endgroup::"
            fi
          done

      - name: Summary
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "## Skill Files Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checked ${{ steps.changed-files.outputs.changed_files_count }} skill file(s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Link validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cross-reference validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code example testing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Format checking" >> $GITHUB_STEP_SUMMARY
