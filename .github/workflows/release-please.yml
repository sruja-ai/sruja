# Release Please: CHANGELOG and release PR from conventional commits.
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: "Force the next release version (e.g. 0.26.1) to override breaking-change detection"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Full history + tags required so release-please can find the last release tag
      # (e.g. sruja-v0.17.2) and only include commits since then in the changelog.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release_override
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_as != ''
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}
          release-as: ${{ github.event.inputs.release_as }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release_default
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_as == ''
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: release
        env:
          TAG_NAME: ${{ steps.release_override.outputs.tag_name || steps.release_default.outputs.tag_name }}
          RELEASE_CREATED: ${{ steps.release_override.outputs.release_created || steps.release_default.outputs.release_created }}
        run: |
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_created=$RELEASE_CREATED" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN cannot trigger workflow_dispatch (403). Call workflows directly so they run in this run.
  build-cli:
    name: Build and attach CLI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  publish-extension:
    name: Publish extension
    needs: release-please
    # Tag is e.g. sruja-v0.7.6 (package-name + version); allow both v* and sruja-v*.
    if: needs.release-please.outputs.release_created == 'true' && (startsWith(needs.release-please.outputs.tag_name, 'v') || startsWith(needs.release-please.outputs.tag_name, 'sruja-v'))
    uses: ./.github/workflows/publish-extension.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
