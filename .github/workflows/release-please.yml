name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN cannot trigger workflow_dispatch (403). Call workflows directly so they run in this run.
  build-cli:
    name: Build and attach CLI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  publish-extension:
    name: Publish extension
    needs: release-please
    # Tag is e.g. sruja-v0.7.6 (package-name + version); allow both v* and sruja-v*.
    if: needs.release-please.outputs.release_created == 'true' && (startsWith(needs.release-please.outputs.tag_name, 'v') || startsWith(needs.release-please.outputs.tag_name, 'sruja-v'))
    uses: ./.github/workflows/publish-extension.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
