name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # Releases created by GITHUB_TOKEN do not trigger other workflows, so we
      # explicitly trigger the CLI build and extension publish when a release is created.
      - name: Trigger release CLI build
        if: steps.release.outputs.release_created == 'true'
        run: gh workflow run release-cli.yml -f version="${{ steps.release.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger extension publish
        if: steps.release.outputs.release_created == 'true'
        run: gh workflow run publish-extension.yml -f version="${{ steps.release.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
