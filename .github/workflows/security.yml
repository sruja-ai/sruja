name: Security Scanning

on:
  push:
    branches: [main, develop, simplify]
  pull_request:
    branches: [main, develop, simplify]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit
      # Advisory ignores in .cargo/audit.toml (e.g. unmaintained transitive crates)
      - name: Run cargo audit
        run: cargo audit

  # Secret scanning — TruffleHog action errors when BASE and HEAD resolve to the same commit
  # (common on push to main). Run diff scan on PRs only; push/schedule skip to keep job green.
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog (PR diff)
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  # dependency-review-action requires base/head refs (PR or merge_group). Push/schedule have no PR base → skip.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
