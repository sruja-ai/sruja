name: Security Scanning

on:
  push:
    branches: [main, develop, simplify]
  pull_request:
    branches: [main, develop, simplify]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit
      # Advisory ignores in .cargo/audit.toml (e.g. unmaintained transitive crates)
      - name: Run cargo audit
        run: cargo audit

  # Secret scanning — TruffleHog action errors when BASE and HEAD resolve to the same commit
  # (common on push to main). Run diff scan on PRs only; push/schedule skip to keep job green.
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog (PR diff)
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  # GitHub Dependency Review requires Dependency graph enabled (Settings → Code security and analysis).
  # When disabled, actions/dependency-review-action fails the check run and blocks merge even with
  # job-level continue-on-error. Keep this job green with a notice; cargo-audit still runs above.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Dependency graph prerequisite
        shell: bash
        run: |
          echo "::notice::Skipping actions/dependency-review-action: enable Dependency graph for the"
          echo "::notice::repository to run automated dependency review on PRs. Cargo audit still runs in this workflow."
          exit 0
