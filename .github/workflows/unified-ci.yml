name: CI

on:
  push:
    branches: [main, develop, simplify]
  pull_request:
    branches: [main, develop, simplify]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      sruja: ${{ steps.filter.outputs.sruja }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            sruja:
              - '**/*.sruja'
              - '.github/actions/sruja-validate/**'
            skills:
              - 'skills/**'
              - '.github/actions/skill-lint-validate/**'

  rust:
    name: Rust build, test, format, lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --workspace
      - name: Format (code per standards in .sruja)
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings

  sruja-files:
    name: Sruja files (lint)
    needs: changes
    if: needs.changes.outputs.sruja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Validate all .sruja files
        uses: ./.github/actions/sruja-validate
        with:
          working-directory: .
          files: "**/*.sruja"

  skill-files:
    name: Skill files (validate)
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Validate all skill markdown files
        uses: ./.github/actions/skill-lint-validate
        with:
          working-directory: .
          files: "skills/**/*.md"
          check-links: "true"
          check-xrefs: "true"
          test-code: "true"
          check-format: "true"
