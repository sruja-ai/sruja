name: CI

on:
  push:
    branches: [main, develop, simplify]
  pull_request:
    branches: [main, develop, simplify]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust build, test, format, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Format (code per standards in .sruja)
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy -- -D warnings

  sruja-files:
    name: Sruja files (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Validate all .sruja files
        uses: ./.github/actions/sruja-validate
        with:
          working-directory: .
          files: "**/*.sruja"
