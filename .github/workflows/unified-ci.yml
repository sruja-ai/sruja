name: CI

on:
  push:
    branches: [main, develop, simplify]
  pull_request:
    branches: [main, develop, simplify]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      sruja: ${{ steps.filter.outputs.sruja }}
      skills: ${{ steps.filter.outputs.skills }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            sruja:
              - '**/*.sruja'
              - '.github/actions/sruja-validate/**'
            skills:
              - 'skills/**'
              - '.github/actions/skill-lint-validate/**'
            version:
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'extension/package.json'
              - 'extension/package-lock.json'
              - '.release-please-manifest.json'
              - 'release-please-config.json'

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify version consistency
        run: ./scripts/verify-version-consistency.sh .

  rust:
    name: Rust build, test, format, lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --release
      - name: Perf smoke (parse < 100ms, release)
        run: cargo test -p sruja-language --release perf_parse_docs_platform_under_100ms -- --ignored
      - name: Test
        run: cargo test --workspace
      - name: Format (code per standards in .sruja)
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Check IDE context files match architecture
        run: ./target/release/sruja sync-ide-rules -r . --check

  wasm:
    name: WASM tests (wasm-pack --node)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Test WASM (Node)
        run: cd crates/sruja-wasm && wasm-pack test --node

  sruja-files:
    name: Sruja files (lint)
    needs: changes
    if: needs.changes.outputs.sruja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate all .sruja files
        uses: ./.github/actions/sruja-validate
        with:
          working-directory: .
          files: "**/*.sruja"

  skill-files:
    name: Skill files (validate)
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate all skill markdown files
        uses: ./.github/actions/skill-lint-validate
        with:
          working-directory: .
          files: "skills/**/*.md"
          check-links: "true"
          check-xrefs: "true"
          test-code: "true"
          check-format: "true"
