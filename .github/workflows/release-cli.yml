# Build Sruja CLI for multiple platforms and attach binaries + install script to the GitHub Release.
# Triggered by: (1) release published, (2) workflow_call (from release-please), or (3) workflow_dispatch (manual).
name: Build and attach CLI to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.6.1). Required when dispatched manually."
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release tag (e.g. v0.6.1 or sruja-v0.7.1)."
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Avoid this run being cancelled when another release is triggered (e.g. two merges to main).
# Each release tag gets its own group; we never cancel a run in progress.
concurrency:
  group: release-cli-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.version || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  # Normalize version for artifact filenames (sruja-v0.7.2 -> 0.7.2); tag stays full for gh-release.
  set-version:
    name: Set version for artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Prefer passed version (workflow_call/workflow_dispatch); caller's event_name may be push.
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          elif [ -n "$EVENT_RELEASE_TAG" ]; then
            TAG="$EVENT_RELEASE_TAG"
          else
            echo "::error::No release tag. workflow_call/workflow_dispatch must pass version; release event must have tag. EVENT_NAME=$EVENT_NAME"
            exit 1
          fi
          V="${TAG#sruja-}"
          V="${V#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$TAG -> artifact version=$V"

  build:
    name: Build ${{ matrix.os_id }}-${{ matrix.arch }}
    needs: set-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os_id: linux
            arch: x86_64
            artifact_name: sruja-linux-x86_64
          - runner: macos-14
            os_id: darwin
            arch: aarch64
            artifact_name: sruja-darwin-aarch64
          # macos-13 (Intel) is no longer supported by GitHub; ship aarch64 only for macOS
          - runner: windows-latest
            os_id: windows
            arch: x86_64
            artifact_name: sruja-windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build CLI
        run: cargo build --release -p sruja-cli

      - name: Pack archive (Linux/macOS)
        if: matrix.os_id != 'windows'
        run: |
          VERSION="${{ needs.set-version.outputs.version }}"
          mkdir -p staging
          cp target/release/sruja staging/
          cd staging && tar czf "../sruja-${VERSION}-${{ matrix.os_id }}-${{ matrix.arch }}.tar.gz" sruja && cd ..

      - name: Pack archive (Windows)
        if: matrix.os_id == 'windows'
        run: |
          $version = "${{ needs.set-version.outputs.version }}"
          Compress-Archive -Path target/release/sruja.exe -DestinationPath "sruja-$version-${{ matrix.os_id }}-${{ matrix.arch }}.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: sruja-*

  build-failed:
    name: Build failed
    runs-on: ubuntu-latest
    needs: [set-version, build]
    if: always() && needs.build.result == 'failure'
    steps:
      - run: |
          echo "::error::One or more build matrix jobs failed. 'Attach assets to release' was skipped."
          echo "Check the failed job(s) above: Build linux-x86_64, Build darwin-aarch64, or Build windows-x86_64."
          exit 1

  upload-release:
    name: Attach assets to release
    runs-on: ubuntu-latest
    needs: [set-version, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Prepare release assets
        run: |
          echo "Artifacts to attach:"
          find release-assets -type f
          mkdir -p upload
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} upload/ \;
          ls -la upload/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@1853d73993c8ca1b2c9c1a7fede39682d0ab5c2a # v2.5.3.5.2.5.3
        with:
          tag_name: ${{ needs.set-version.outputs.tag }}
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
