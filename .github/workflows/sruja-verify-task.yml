# Dogfood harness gate on this repo (uses built CLI from PR branch).
name: Sruja Verify Task

on:
  pull_request:
    branches: [main, develop, simplify]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-task-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-task:
    name: Harness gate (verify-task)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Sruja CLI
        run: cargo build --release -p sruja-cli

      - name: Verify coding profile
        run: ./target/release/sruja verify-task --profile coding -r . -f json --max-runtime-ms 600000
