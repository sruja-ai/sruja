# Deploy mdBook site to sruja-ai/staging-website on push to main.
# Uses existing secrets: SRUJA_WEBSITE_DEPLOY_APP_ID, SRUJA_WEBSITE_DEPLOY_APP_PRIVATE_KEY
name: Deploy to Staging

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "crates/sruja-wasm/**"
      - "crates/sruja-cli/**"
      - "crates/sruja-export/**"
      - "crates/sruja-language/**"
      - "crates/sruja-engine/**"
      - "book/valid-examples/**"
      - "scripts/**"
      - ".github/workflows/deploy-staging.yml"
      - ".github/actions/deploy-to-github-pages/**"
      - ".github/templates/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install mdbook and preprocessors
        run: |
          cargo install mdbook mdbook-mermaid mdbook-frontmatter-strip
          which mdbook mdbook-mermaid mdbook-frontmatter-strip

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build sruja CLI (for preprocessor)
        run: cargo build --release -p sruja-cli

      - name: Build WASM (web target for book)
        run: |
          PKG_DIR="${{ github.workspace }}/crates/sruja-wasm/pkg"
          wasm-pack build --target web --out-dir "$PKG_DIR" crates/sruja-wasm --release
          if ! test -f "$PKG_DIR/sruja_wasm.js" || ! test -f "$PKG_DIR/sruja_wasm_bg.wasm"; then
            echo "WASM build did not produce expected artifacts in $PKG_DIR"
            ls -la "$PKG_DIR" 2>/dev/null || true
            exit 1
          fi
          echo "WASM artifacts OK: $PKG_DIR"

      - name: Optimize WASM with wasm-opt (reduce size for book)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binaryen brotli
          PKG_DIR="${{ github.workspace }}/crates/sruja-wasm/pkg"
          wasm-opt --enable-bulk-memory --enable-sign-ext --enable-nontrapping-float-to-int -Oz --strip-debug \
            "$PKG_DIR/sruja_wasm_bg.wasm" -o "$PKG_DIR/sruja_wasm_bg.wasm.tmp"
          mv "$PKG_DIR/sruja_wasm_bg.wasm.tmp" "$PKG_DIR/sruja_wasm_bg.wasm"
          echo "wasm-opt applied (smaller .wasm for deploy)"

      - name: Compress WASM (gzip + brotli for smaller transfer)
        run: |
          PKG_DIR="${{ github.workspace }}/crates/sruja-wasm/pkg"
          gzip -9 -k -f "$PKG_DIR/sruja_wasm_bg.wasm"
          brotli -q 11 -k -f "$PKG_DIR/sruja_wasm_bg.wasm"
          ls -la "$PKG_DIR"/sruja_wasm_bg.wasm*

      - name: Build book
        run: |
          export PATH="$PWD/target/release:$PATH"
          cd book
          mdbook build
          cd ..

      - name: Copy WASM into book output
        run: ./book/copy-wasm.sh book

      - name: Verify WASM in book output (required for staging)
        run: |
          WASM_DIR="book/book/wasm/rust"
          if ! test -f "$WASM_DIR/sruja_wasm.js" || ! test -f "$WASM_DIR/sruja_wasm_bg.wasm"; then
            echo "::error::WASM files missing in $WASM_DIR - staging would serve broken 'Show diagram'"
            ls -la "$WASM_DIR" 2>/dev/null || true
            exit 1
          fi
          echo "WASM present in book output (will be deployed):"
          ls -la "$WASM_DIR"

      - name: Copy install script into book output
        run: cp scripts/install.sh book/book/install.sh

      - name: Deploy to staging-website
        uses: ./.github/actions/deploy-to-github-pages
        with:
          site-path: book/book
          target-repo: staging-website
          target-branch: main
          app-id: ${{ secrets.SRUJA_WEBSITE_DEPLOY_APP_ID }}
          app-private-key: ${{ secrets.SRUJA_WEBSITE_DEPLOY_APP_PRIVATE_KEY }}
          commit-message: "deploy: staging from sruja-ai/sruja@${{ github.sha }}"
