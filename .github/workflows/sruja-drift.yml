name: Sruja Architecture Drift
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    concurrency:
      group: sruja-drift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Wait for Sruja Check workflow
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const workflowId = "sruja-check.yml";

            const maxAttempts = 100;
            const sleepMs = 15000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: sha,
                per_page: 5,
              });

              const run = (data.workflow_runs || [])[0];
              if (!run) {
                if (attempt === maxAttempts) {
                  throw new Error(`No workflow runs found for ${workflowId} at ${sha}`);
                }
                await new Promise(r => setTimeout(r, sleepMs));
                continue;
              }

              if (run.status !== "completed") {
                if (attempt === maxAttempts) {
                  throw new Error(`Workflow ${workflowId} did not complete in time (run_id=${run.id}, status=${run.status})`);
                }
                await new Promise(r => setTimeout(r, sleepMs));
                continue;
              }

              if (run.conclusion !== "success") {
                throw new Error(`Workflow ${workflowId} concluded with ${run.conclusion} (run_id=${run.id})`);
              }

              return;
            }

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build sruja (CLI)
        run: cargo build --release -p sruja-cli

      - name: Drift check (baseline repo.sruja)
        run: ./target/release/sruja drift -r . -a repo.sruja -f github-actions
