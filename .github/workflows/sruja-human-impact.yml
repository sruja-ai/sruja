name: Sruja Human Impact Report
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  impact-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build sruja (CLI)
        run: cargo build --release -p sruja-cli

      - name: Generate impact report
        id: impact
        run: |
          # Get changed files
          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          
          # Generate system map
          MAP_OUTPUT=$(./target/release/sruja human map -r . -f json 2>/dev/null || echo '{}')
          
          # Generate impact for each changed file
          IMPACT_REPORT=""
          for file in $CHANGED_FILES; do
            if [[ -f "$file" ]]; then
              BEFORE_OUTPUT=$(./target/release/sruja human before "$file" -r . -f json 2>/dev/null || echo '{}')
              if [[ "$BEFORE_OUTPUT" != "{}" ]]; then
                DOWNSTREAM_COUNT=$(echo "$BEFORE_OUTPUT" | jq -r '.downstream_count // 0')
                if [[ "$DOWNSTREAM_COUNT" -gt 0 ]]; then
                  TARGET_LABEL=$(echo "$BEFORE_OUTPUT" | jq -r '.target_label // "unknown"')
                  IMPACT_REPORT="${IMPACT_REPORT}### 📄 ${file}"$'\n'
                  IMPACT_REPORT="${IMPACT_REPORT}- **Element:** ${TARGET_LABEL}"$'\n'
                  IMPACT_REPORT="${IMPACT_REPORT}- **Downstream elements affected:** ${DOWNSTREAM_COUNT}"$'\n'
                  
                  # List top 5 downstream elements
                  DOWNSTREAM_LIST=$(echo "$BEFORE_OUTPUT" | jq -r '.downstream[0:5][] | "  - \(.label) (\(.repo_id))"' 2>/dev/null)
                  if [[ -n "$DOWNSTREAM_LIST" ]]; then
                    IMPACT_REPORT="${IMPACT_REPORT}- **Top affected:**"${'\n'}"${DOWNSTREAM_LIST}"$'\n'
                  fi
                  
                  # Add gotchas if any
                  GOTCHAS=$(echo "$BEFORE_OUTPUT" | jq -r '.gotchas[]? | "  - ⚠️ \(.)"' 2>/dev/null)
                  if [[ -n "$GOTCHAS" ]]; then
                    IMPACT_REPORT="${IMPACT_REPORT}- **Gotchas:**"${'\n'}"${GOTCHAS}"$'\n'
                  fi
                  
                  IMPACT_REPORT="${IMPACT_REPORT}"$'\n'
                fi
              fi
            fi
          done
          
          # Generate what-if for changed crates
          CHANGED_CRATES=$(echo "$CHANGED_FILES" | grep 'crates/' | cut -d'/' -f1-2 | sort -u)
          WHATIF_REPORT=""
          for crate_path in $CHANGED_CRATES; do
            CRATE_NAME=$(basename "$crate_path")
            WHATIF_OUTPUT=$(./target/release/sruja human what-if "$CRATE_NAME" -r . -f json 2>/dev/null || echo '{}')
            if [[ "$WHATIF_OUTPUT" != "{}" ]]; then
              DIRECT_COUNT=$(echo "$WHATIF_OUTPUT" | jq -r '.direct_effects | length')
              BLAST_REPOS=$(echo "$WHATIF_OUTPUT" | jq -r '.blast_repos // 0')
              if [[ "$DIRECT_COUNT" -gt 0 ]]; then
                WHATIF_REPORT="${WHATIF_REPORT}### 🔄 What-If: ${CRATE_NAME}"$'\n'
                WHATIF_REPORT="${WHATIF_REPORT}- **Direct effects:** ${DIRECT_COUNT} elements"$'\n'
                WHATIF_REPORT="${WHATIF_REPORT}- **Repos affected:** ${BLAST_REPOS}"$'\n'
                
                # List direct effects
                EFFECTS=$(echo "$WHATIF_OUTPUT" | jq -r '.direct_effects[0:5][] | "  - \(.label): \(.effect)"' 2>/dev/null)
                if [[ -n "$EFFECTS" ]]; then
                  WHATIF_REPORT="${WHATIF_REPORT}- **Effects:**"${'\n'}"${EFFECTS}"$'\n'
                fi
                
                WHATIF_REPORT="${WHATIF_REPORT}"$'\n'
              fi
            fi
          done
          
          # Build final comment using heredoc
          {
            echo "## 🏗️ Sruja Human Impact Report"
            echo ""
            if [[ -n "$IMPACT_REPORT" ]]; then
              echo "### Impact Preview"
              echo "$IMPACT_REPORT"
            else
              echo "### Impact Preview"
              echo "✅ No significant downstream impact detected."
              echo ""
            fi
            if [[ -n "$WHATIF_REPORT" ]]; then
              echo "### What-If Analysis"
              echo "$WHATIF_REPORT"
            fi
            echo "### System Overview"
            echo '```json'
            echo "$MAP_OUTPUT"
            echo '```'
            echo ""
            echo "---"
            echo "*Generated by [Sruja](https://github.com/sruja/sruja) — Human-Centric System Intelligence*"
          } > /tmp/impact-report.md
          
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: /tmp/impact-report.md
